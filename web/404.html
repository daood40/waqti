<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>وقتي</title>
  <!-- GitHub Pages: أي مسار غير معروف يعود إلى جذر التطبيق (SPA rewrite). -->
  <script>
    (function () {
      var base = '/waqti/';
      var here = location.pathname;
      if (here.indexOf(base) === 0 && here !== base) {
        location.replace(base + location.search + location.hash);
      } else if (here.indexOf(base) !== 0) {
        location.replace(base);
      }
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/waqti/"></noscript>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 3rem">
  <p>جارٍ التحويل إلى <a href="/waqti/">وقتي</a>…</p>
</body>
</html>
