name: waqti
description: "وقتي — تطبيق تتبع المهام والعادات اليومية | Waqti — daily tasks & habits tracker"
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  hijri: ^3.0.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  msix: ^3.16.8

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#E9EDE3"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#F6F7F1"
    theme_color: "#6E8F72"

# حزمة متجر مايكروسوفت: dart run msix:create --store
# القيم الثلاث publisher/identity/publisher_display_name تُستبدل
# بقيم Partner Center قبل الرفع (انظر docs/RELEASE.md).
msix_config:
  display_name: وقتي
  publisher_display_name: Waqti
  identity_name: com.waqti.waqti
  msix_version: 1.2.0.0
  logo_path: assets/branding/app_icon.png
  languages: ar, en
  capabilities: ""

flutter:
  uses-material-design: true

  assets:
    - assets/branding/app_icon.png

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
