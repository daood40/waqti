# بنيات الإطلاق للمتاجر — تُشغَّل يدويًا من تبويب Actions أو عند وسم إصدار vX.Y.Z.
# تنتج: AAB/APK لأندرويد (موقّعة إن وُجدت أسرار المفتاح)، حزمة ويندوز + MSIX،
# حزمة ويب، وبنية iOS بلا توقيع (التوقيع والرفع يتمان من جهاز Mac — انظر docs/RELEASE.md).
name: Release Builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - name: Restore signing key (if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            echo "$KEY_PROPERTIES" > android/key.properties
            echo "signed=yes"
          else
            echo "signed=no (debug keys; add ANDROID_KEYSTORE_BASE64 + ANDROID_KEY_PROPERTIES secrets)"
          fi
      - run: flutter pub get
      - run: flutter build appbundle --release
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: waqti-android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: MSIX package (unsigned, for Microsoft Store)
        run: dart run msix:create --store
        continue-on-error: true
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath waqti-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: waqti-windows
          path: |
            waqti-windows.zip
            build/windows/x64/runner/Release/*.msix

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - name: Zip web build
        run: cd build/web && zip -r ../../waqti-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: waqti-web
          path: waqti-web.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Zip Runner.app
        run: cd build/ios/iphoneos && zip -r ../../../waqti-ios-nosign.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: waqti-ios-nosign
          path: waqti-ios-nosign.zip
