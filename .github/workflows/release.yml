# بنيات الإطلاق للمتاجر — تُشغَّل يدويًا من تبويب Actions أو عند وسم إصدار vX.Y.Z.
# تنتج: AAB/APK لأندرويد (موقّعة إن وُجدت أسرار المفتاح)، حزمة ويندوز + MSIX،
# حزمة ويب، وبنية iOS بلا توقيع (التوقيع والرفع يتمان من جهاز Mac — انظر docs/RELEASE.md).
name: Release Builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: "إصدار للنشر كـ GitHub Release (مثال v1.1.0) — اتركه فارغًا لبناء الحِزم فقط"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - name: Restore signing key (if secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_PROPERTIES" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            echo "$KEY_PROPERTIES" > android/key.properties
            echo "signed=yes"
          else
            echo "signed=no (debug keys; add ANDROID_KEYSTORE_BASE64 + ANDROID_KEY_PROPERTIES secrets)"
          fi
      - run: flutter pub get
      - run: flutter build appbundle --release
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: waqti-android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      # مع أسرار MSIX_PUBLISHER (+ MSIX_IDENTITY_NAME/MSIX_PUBLISHER_DISPLAY_NAME) من Partner Center:
      # حزمة متجر. بدونها: حزمة اختبارية موقّعة بشهادة تجريبية (للتثبيت الجانبي فقط).
      - name: MSIX package
        shell: bash
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          if [ -n "$MSIX_PUBLISHER" ]; then
            echo "store MSIX"
            dart run msix:create --store --publisher "$MSIX_PUBLISHER" \
              --identity-name "${MSIX_IDENTITY_NAME:-com.waqti.waqti}" \
              --publisher-display-name "${MSIX_PUBLISHER_DISPLAY_NAME:-Waqti}"
          else
            echo "no MSIX_PUBLISHER secret -> test-signed MSIX (sideload only)"
            dart run msix:create
          fi
        continue-on-error: true
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath waqti-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: waqti-windows
          path: |
            waqti-windows.zip
            build/windows/x64/runner/Release/*.msix

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - name: Zip web build
        run: cd build/web && zip -r ../../waqti-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: waqti-web
          path: waqti-web.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Zip Runner.app
        run: cd build/ios/iphoneos && zip -r ../../../waqti-ios-nosign.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: waqti-ios-nosign
          path: waqti-ios-nosign.zip

  # عند وسم vX.Y.Z: يجمع الحِزم الأربع في GitHub Release بروابط تحميل مباشرة.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [android, windows, web, ios]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename for direct links
        run: |
          set -e
          GITHUB_REF_NAME="$VERSION"
          mkdir -p out
          cp dist/waqti-android/bundle/release/app-release.aab out/waqti-${GITHUB_REF_NAME}.aab 2>/dev/null || cp $(find dist -name '*.aab' | head -1) out/waqti-${GITHUB_REF_NAME}.aab
          cp $(find dist -name 'app-release.apk' | head -1) out/waqti-${GITHUB_REF_NAME}.apk
          cp $(find dist -name 'waqti-windows.zip' | head -1) out/waqti-${GITHUB_REF_NAME}-windows.zip
          MSIX=$(find dist -name '*.msix' | head -1); [ -n "$MSIX" ] && cp "$MSIX" out/waqti-${GITHUB_REF_NAME}.msix || true
          cp $(find dist -name 'waqti-web.zip' | head -1) out/waqti-${GITHUB_REF_NAME}-web.zip
          cp $(find dist -name 'waqti-ios-nosign.zip' | head -1) out/waqti-${GITHUB_REF_NAME}-ios-nosign.zip
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: وقتي ${{ env.VERSION }}
          body: |
            حِزم الإصدار ${{ env.VERSION }} — أندرويد (APK للتجربة، AAB للمتجر)، ويندوز (zip + MSIX)، ويب، iOS بلا توقيع.
            الويب مباشرة: https://daood40.github.io/waqti/
          files: out/*
