<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وقتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F7F1;
    --surface:#FFFFFF;
    --surface-alt:#EEF2E7;
    --primary:#6E8F72;
    --primary-dark:#4F6E54;
    --primary-light:#DCE7DD;
    --text:#20291F;
    --text-muted:#6C7A69;
    --border:#E5E9DE;
    --done:#4CAF6D;
    --late:#E3A93F;
    --missed:#E1615A;
    --none:#D7DCCF;
    --shadow: 0 6px 24px rgba(40,55,40,.08);
    --radius:18px;
    --radius-sm:12px;
  }
  [data-theme="dark"]{
    --bg:#141C15;
    --surface:#1C261C;
    --surface-alt:#233024;
    --primary:#7FA184;
    --primary-dark:#5C7C60;
    --primary-light:#2B3A2C;
    --text:#EAF1E7;
    --text-muted:#93A390;
    --border:#2C3A2C;
    --shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Tajawal','Inter',sans-serif;
    min-height:100vh;
  }
  body[data-lang="en"]{ font-family:'Inter','Tajawal',sans-serif; }
  #app{display:flex; flex-direction:column; min-height:100vh;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  /* Brand (logo in topbar) */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:22px; flex-wrap:wrap;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:16.5px; flex-shrink:0;}
  .brand img{width:40px;height:40px;border-radius:12px; box-shadow:var(--shadow); display:block; object-fit:cover; flex-shrink:0;}

  /* Bottom navigation bar */
  .bottom-nav{
    position:fixed; bottom:0; inset-inline:0; height:66px; background:var(--surface);
    border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-around;
    padding:0 6px calc(env(safe-area-inset-bottom,0px)); z-index:30; box-shadow:0 -4px 18px rgba(30,40,30,.06);
  }
  .nav-btn{
    width:46px;height:46px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:19px;color:var(--text-muted); cursor:pointer; border:none; background:transparent; transition:.15s; flex-shrink:0;
  }
  .nav-btn:hover{background:var(--surface-alt); color:var(--text);}
  .nav-btn.active{background:var(--primary-light); color:var(--primary-dark);}
  .nav-btn.add{
    width:56px;height:56px;border-radius:50%; background:linear-gradient(160deg,var(--primary),var(--primary-dark));
    color:#fff; box-shadow:var(--shadow); margin-top:-24px; border:4px solid var(--bg); font-size:26px; flex-shrink:0;
  }
  .nav-btn.add:hover{background:var(--primary-dark);}

  /* Main */
  .main{flex:1; padding:20px 18px calc(96px + env(safe-area-inset-bottom,0px)); min-width:0;}
  .month-switch{display:flex; align-items:center; gap:10px; font-size:15px; color:var(--text-muted);}
  .month-switch button{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--border); background:var(--surface);
    cursor:pointer; color:var(--text); display:flex;align-items:center;justify-content:center;
  }
  .month-title{font-size:20px; font-weight:800;}
  .search-box{
    display:flex;align-items:center;gap:8px;background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:8px 14px; min-width:130px; flex:1; max-width:260px;
  }
  .search-box input{border:none; outline:none; background:transparent; color:var(--text); width:100%; font-family:inherit; font-size:14px;}

  .card{background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border);}
  .stat-row{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
  .stat-card{flex:1; min-width:130px; padding:18px; text-align:center;}
  .stat-card .ic{font-size:20px; margin-bottom:6px;}
  .stat-card .val{font-size:26px; font-weight:800;}
  .stat-card .lbl{font-size:12.5px; color:var(--text-muted); margin-top:2px;}

  .ring-card{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:18px; min-width:170px;}
  .ring-wrap{position:relative; width:110px; height:110px;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800;}
  .ring-lbl{margin-top:6px; font-size:12.5px; color:var(--text-muted);}

  /* grid table */
  .grid-wrap{overflow-x:auto; padding:0 14px 8px;}
  table.habit-grid{border-collapse:separate; border-spacing:0; width:100%; table-layout:fixed;}
  table.habit-grid th, table.habit-grid td{padding:9px 2px; text-align:center; font-size:12px; border-inline-end:1px solid var(--border);}
  table.habit-grid th:last-child, table.habit-grid td:last-child{border-inline-end:none;}
  table.habit-grid thead th{color:var(--text-muted); font-weight:600; background:var(--surface-alt);}
  table.habit-grid thead th.today{color:var(--primary-dark); font-weight:800;}
  .day-wd{font-size:10px; font-weight:600; color:var(--text-muted);}
  .day-num{font-size:13.5px; font-weight:800; margin-top:2px;}
  .day-nav{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 4px;}
  .day-nav .rng{font-size:12.5px; color:var(--text-muted); font-weight:700;}
  .task-cell{
    display:flex; align-items:center; justify-content:center; text-align:start; position:relative;
    background:var(--surface); padding:10px 2px;
  }
  .task-ic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0; cursor:pointer;}
  .task-name-tag{
    position:absolute; right:2px; left:auto; top:50%; transform:translateY(-50%);
    background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:5px 12px;
    font-size:12.5px; font-weight:700; white-space:nowrap; box-shadow:var(--shadow); z-index:15; cursor:pointer;
  }
  tr.task-row:hover td{background:var(--surface-alt);}
  .status-dot{
    width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:13px; color:#fff; border:2px solid transparent; user-select:none; position:relative; z-index:1;
  }
  .status-dot.pending{background:transparent; border-color:var(--none); color:transparent;}
  .status-dot.done{background:var(--done);}
  .status-dot.late{background:var(--late);}
  .status-dot.missed{background:var(--missed);}
  .status-dot.na{background:transparent; border:2px solid var(--none); cursor:default; opacity:.5;}
  .legend{display:flex; gap:18px; flex-wrap:wrap; margin-top:16px; font-size:12.5px; color:var(--text-muted); justify-content:center;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:14px;height:14px;border-radius:50%; display:inline-block;}

  .section-title{font-size:17px; font-weight:800; margin:26px 0 12px;}
  .empty-hint{color:var(--text-muted); font-size:13.5px; padding:30px; text-align:center;}

  /* Tasks tab */
  .task-list{display:flex; flex-direction:column; gap:10px;}
  .task-list-item{display:flex; align-items:center; gap:12px; padding:12px 14px;}
  .task-list-item .meta{flex:1; min-width:0;}
  .task-list-item .meta .n{font-weight:700; font-size:14px;}
  .task-list-item .meta .s{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .chip{display:inline-block; font-size:11px; padding:2px 9px; border-radius:20px; background:var(--surface-alt); color:var(--text-muted); margin-inline-end:6px;}
  .icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border); background:var(--surface); cursor:pointer; display:flex;align-items:center;justify-content:center; color:var(--text-muted); font-size:14px;}
  .icon-btn:hover{background:var(--surface-alt); color:var(--text);}
  .btn{padding:10px 18px; border-radius:12px; border:none; cursor:pointer; font-weight:700; font-size:13.5px; font-family:inherit;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:var(--surface-alt); color:var(--text);}
  .btn-danger{background:var(--missed); color:#fff;}
  .fab-add{position:fixed; inset-inline-end:22px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:20; width:56px;height:56px;border-radius:50%; box-shadow:var(--shadow); font-size:24px;}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(10,15,10,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal{background:var(--surface); border-radius:20px; width:100%; max-width:460px; max-height:90vh; overflow-y:auto; padding:22px; box-shadow:var(--shadow);}
  .modal h3{margin:0 0 16px; font-size:18px; font-weight:800;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--text-muted); margin-bottom:6px; font-weight:600;}
  .field input[type=text], .field input[type=password], .field input[type=number], .field input[type=date], .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:inherit; font-size:13.5px; outline:none;
  }
  .field textarea{resize:vertical; min-height:56px;}
  .swatches{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{width:28px;height:28px;border-radius:50%; cursor:pointer; border:3px solid transparent;}
  .swatch.sel{border-color:var(--text);}
  .emojis{display:flex; gap:6px; flex-wrap:wrap;}
  .emo{width:34px;height:34px;border-radius:9px; display:flex;align-items:center;justify-content:center; cursor:pointer; background:var(--surface-alt); font-size:16px; border:2px solid transparent;}
  .emo.sel{border-color:var(--primary);}
  .weekday-picker{display:flex; gap:6px; flex-wrap:wrap;}
  .wd{padding:6px 10px; border-radius:8px; background:var(--surface-alt); font-size:12px; cursor:pointer; border:2px solid transparent;}
  .wd.sel{border-color:var(--primary); background:var(--primary-light);}
  .toggle-row{display:flex; align-items:center; justify-content:space-between;}
  .switch{width:42px;height:24px;border-radius:20px;background:var(--none); position:relative; cursor:pointer; flex-shrink:0;}
  .switch.on{background:var(--primary);}
  .switch .knob{position:absolute; top:2px; inset-inline-start:2px; width:20px;height:20px; border-radius:50%; background:#fff; transition:.15s;}
  .switch.on .knob{inset-inline-start:20px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions .btn{flex:1;}

  /* stats & achievements */
  .stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px;}
  .stat-box{padding:16px;}
  .stat-box .v{font-size:20px; font-weight:800;}
  .stat-box .l{font-size:12px; color:var(--text-muted); margin-top:4px;}
  .bars{display:flex; align-items:flex-end; gap:6px; height:130px; padding:16px 8px 6px;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px;}
  .bar{width:100%; border-radius:6px 6px 0 0; background:var(--primary); min-height:2px;}
  .bar-lbl{font-size:10px; color:var(--text-muted);}

  .ach-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px;}
  .ach-card{padding:16px; text-align:center; opacity:.4;}
  .ach-card.unlocked{opacity:1;}
  .ach-card .ic{font-size:28px; margin-bottom:8px;}
  .ach-card .t{font-weight:700; font-size:13px;}
  .ach-card .d{font-size:11px; color:var(--text-muted); margin-top:3px;}
  .level-bar{height:10px; border-radius:10px; background:var(--surface-alt); overflow:hidden; margin-top:8px;}
  .level-bar .fill{height:100%; background:linear-gradient(90deg,var(--primary),var(--primary-dark));}

  /* settings */
  .settings-group{padding:18px; margin-bottom:16px;}
  .settings-group h4{margin:0 0 12px; font-size:14px;}
  .seg{display:flex; background:var(--surface-alt); border-radius:12px; padding:4px; gap:4px;}
  .seg button{flex:1; border:none; background:transparent; padding:9px; border-radius:9px; cursor:pointer; font-family:inherit; font-size:13px; color:var(--text-muted); font-weight:700;}
  .seg button.active{background:var(--primary); color:#fff;}
  .settings-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);}
  .settings-row:last-child{border-bottom:none;}

  /* profile */
  .profile-card{display:flex; align-items:center; gap:14px; padding:18px;}
  .avatar{width:52px;height:52px;border-radius:50%; background:linear-gradient(160deg,var(--primary),var(--primary-dark)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:800; flex-shrink:0;}
  .premium-badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:800; color:#8A6A1F; background:#F4DFA0; padding:2px 8px; border-radius:20px; margin-inline-start:6px;}

  /* ad banner (free tier) */
  .ad-banner{display:flex; align-items:center; gap:12px; padding:14px 16px; margin-top:16px; cursor:pointer; border:1px dashed var(--border);}
  .ad-banner .ic{font-size:22px;}
  .ad-banner .t{flex:1; font-size:12.5px;}
  .ad-banner .t b{display:block; font-size:13.5px; margin-bottom:2px;}
  .ad-tag{font-size:9.5px; color:var(--text-muted); border:1px solid var(--border); border-radius:6px; padding:1px 5px;}

  /* auth screen */
  .auth-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:26px;}
  .auth-box{width:100%; max-width:380px;}
  .auth-logo{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:26px;}
  .auth-logo img{width:64px;height:64px;border-radius:18px; box-shadow:var(--shadow);}
  .auth-logo .n{font-size:20px; font-weight:800;}
  .auth-logo .s{font-size:12.5px; color:var(--text-muted);}
  .auth-card{padding:22px;}
  .auth-divider{display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--text-muted); font-size:12px;}
  .auth-divider::before, .auth-divider::after{content:""; flex:1; height:1px; background:var(--border);}
  .oauth-btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:11px; border-radius:12px; border:1px solid var(--border); background:var(--surface); cursor:pointer; font-family:inherit; font-weight:700; font-size:13.5px; color:var(--text); margin-bottom:9px;}
  .oauth-btn:hover{background:var(--surface-alt);}
  .auth-link{text-align:center; font-size:12.5px; color:var(--primary-dark); cursor:pointer; margin-top:14px; font-weight:700;}
  .auth-guest{text-align:center; font-size:12.5px; color:var(--text-muted); cursor:pointer; margin-top:8px;}
  .field-error{color:var(--missed); font-size:11.5px; margin-top:-8px; margin-bottom:12px;}

  /* subscription */
  .plan-toggle{display:flex; justify-content:center; margin-bottom:20px;}
  .plan-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; margin-bottom:22px;}
  .plan-card{padding:22px; position:relative; border-width:1px;}
  .plan-card.highlight{border:2px solid var(--primary); box-shadow:var(--shadow);}
  .plan-card .tag{position:absolute; top:-11px; inset-inline-start:20px; background:var(--primary); color:#fff; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:20px;}
  .plan-card h4{font-size:15px; margin-bottom:4px;}
  .plan-card .price{font-size:26px; font-weight:800; margin:8px 0 4px;}
  .plan-card .price span{font-size:12px; color:var(--text-muted); font-weight:600;}
  .plan-feat{list-style:none; padding:0; margin:14px 0 0; display:flex; flex-direction:column; gap:9px;}
  .plan-feat li{font-size:12.5px; display:flex; align-items:center; gap:8px;}
  .plan-feat li.off{color:var(--text-muted);}

  h1,h2,h3{margin:0;}
  @media (max-width:720px){
    .main{padding-inline:14px;}
  }
</style>
</head>

    {name:"قراءة كتاب", icon:"📚", color:"#4C8DE0", category:"c3", recurrence:{type:"specific", days:[0,2,4]}, priority:"low"},
    {name:"العمل على المشروع", icon:"💻", color:"#8E6CE0", category:"c4", recurrence:{type:"daily"}, priority:"high"},
    {name:"شرب 2 لتر ماء", icon:"💧", color:"#3FB6B0", category:"c2", recurrence:{type:"daily"}, priority:"medium"},
    {name:"كتابة مذكرات", icon:"📝", color:"#E07EA8", category:"c3", recurrence:{type:"daily"}, priority:"low"},
    {name:"التأمل", icon:"🧘", color:"#6E8F72", category:"c1", recurrence:{type:"specific", days:[0,3]}, priority:"low"},
    {name:"النوم قبل 11 م", icon:"😴", color:"#7A8B99", category:"c2", recurrence:{type:"daily"}, priority:"medium"},
  ];
  const dim = daysInMonth(state.year, state.month);
  return base.map(b=>{
    const t = {id:uid(), name:b.name, desc:"", icon:b.icon, color:b.color, category:b.category,
      recurrence:b.recurrence, priority:b.priority, notif:true, statuses:{}};
    for(let d=1; d<=dim; d++){
      if(!isApplicable(t, d)) continue;
      if(d > today.getDate() && state.month===today.getMonth() && state.year===today.getFullYear()) continue;
      const r = Math.random();
      t.statuses[d] = r<0.72 ? "done" : (r<0.87 ? "late" : "missed");
    }
    return t;
  });
}

/* ---------------- helpers ---------------- */
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function maxWindowStart(dim){ return 1 + 7*Math.floor((dim-1)/7); }
function resetDayWindow(){
  const dim = daysInMonth(state.year, state.month);
  const maxStart = maxWindowStart(dim);
  const isCurrentMonth = state.month===today.getMonth() && state.year===today.getFullYear();
  if(isCurrentMonth){
    const start = 1 + 7*Math.floor((today.getDate()-1)/7);
    state.dayWindowStart = Math.min(start, maxStart);
  } else {
    state.dayWindowStart = 1;
  }
}
function changeDayWindow(delta){
  const dim = daysInMonth(state.year, state.month);
  const maxStart = maxWindowStart(dim);
  let start = state.dayWindowStart + delta*7;
  start = Math.max(1, Math.min(start, maxStart));
  state.dayWindowStart = start;
  render();
}
function isApplicable(task, day){
  const r = task.recurrence;
  const date = new Date(state.year, state.month, day);
  const wd = date.getDay();
  if(r.type==="daily") return true;
  if(r.type==="weekly") return wd === r.weekday;
  if(r.type==="monthly") return day === r.dayOfMonth;
  if(r.type==="specific") return (r.days||[]).includes(wd);
  if(r.type==="once") return r.date === `${state.year}-${String(state.month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  return true;
}
function cycleStatus(taskId, day){
  const task = state.tasks.find(x=>x.id===taskId);
  if(!task || !isApplicable(task, day)) return;
  const order = [undefined,"done","late","missed"];
  const cur = task.statuses[day];
  const idx = order.indexOf(cur);
  const next = order[(idx+1)%order.length];
  if(next===undefined) delete task.statuses[day]; else task.statuses[day]=next;
  render();
}
const taskNameTimers = {};
function toggleTaskName(taskId){
  state.visibleNames.add(taskId);
  render();
  if(taskNameTimers[taskId]) clearTimeout(taskNameTimers[taskId]);
  taskNameTimers[taskId] = setTimeout(()=>{
    state.visibleNames.delete(taskId);
    delete taskNameTimers[taskId];
    render();
  }, 1000);
}
function computeMonthStats(){
  const dim = daysInMonth(state.year, state.month);
  let applicable=0, done=0, late=0, missed=0;
  state.tasks.forEach(task=>{
    for(let d=1; d<=dim; d++){
      if(!isApplicable(task,d)) continue;
      applicable++;
      const s = task.statuses[d];
      if(s==="done") done++;
      else if(s==="late") late++;
      else if(s==="missed") missed++;
    }
  });
  const pct = applicable>0 ? Math.round((done/applicable)*100) : 0;
  return {applicable, done, late, missed, remaining: applicable-done, pct};
}
function computeStreak(){
  const isCurrentMonth = state.month===today.getMonth() && state.year===today.getFullYear();
  let d = isCurrentMonth ? today.getDate() : daysInMonth(state.year,state.month);
  let streak=0;
  while(d>=1){
    const applicableTasks = state.tasks.filter(t=>isApplicable(t,d));
    if(applicableTasks.length===0){ d--; continue; }
    const allDone = applicableTasks.every(t=>t.statuses[d]==="done");
    if(allDone){ streak++; d--; } else break;
  }
  return streak;
}
function computeXP(){
  let xp=0;
  state.tasks.forEach(task=>{
    Object.values(task.statuses).forEach(s=>{
      if(s==="done") xp+=10;
      else if(s==="late") xp+=4;
    });
  });
  return xp;
}
function computeLevel(xp){
  const per=300;
  const level = Math.floor(xp/per)+1;
  const cur = xp % per;
  return {level, cur, per, pct: Math.round((cur/per)*100)};
}
function taskCommitment(task){
  const dim = daysInMonth(state.year, state.month);
  let applicable=0, done=0;
  for(let d=1; d<=dim; d++){
    if(!isApplicable(task,d)) continue;
    applicable++;
    if(task.statuses[d]==="done") done++;
  }
  return applicable>0 ? Math.round((done/applicable)*100) : 0;
}
function bestWorstHabit(){
  if(state.tasks.length===0) return {best:null, worst:null};
  let list = state.tasks.map(t=>({t, pct:taskCommitment(t)}));
  list.sort((a,b)=>b.pct-a.pct);
  return {best:list[0], worst:list[list.length-1]};
}
function catById(id){ return state.categories.find(c=>c.id===id); }

function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- render ---------------- */
function render(){
  document.body.setAttribute('dir', state.lang==='ar' ? 'rtl':'ltr');
  document.body.setAttribute('lang', state.lang);
  document.body.setAttribute('data-lang', state.lang);
  document.documentElement.setAttribute('data-theme', state.theme);

  // preserve focus + cursor position (so typing in search / fields never gets interrupted)
  const activeId = document.activeElement && document.activeElement.id;
  const selStart = document.activeElement && document.activeElement.selectionStart;
  // preserve page scroll position (so a status click never visually "jumps" anywhere)
  const scrollY = window.scrollY;

  const app = document.getElementById('app');

  if(!state.auth.loggedIn){
    app.innerHTML = renderAuthScreen();
    if(activeId){
      const el = document.getElementById(activeId);
      if(el){ el.focus(); if(selStart!=null && el.setSelectionRange) try{el.setSelectionRange(selStart, selStart);}catch(e){} }
    }
    return;
  }

  app.innerHTML = `
    <div class="main">
      ${renderTopbar()}
      ${renderTab()}
    </div>
    ${renderBottomNav()}
    ${state.modal ? renderModal() : ''}
  `;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){ el.focus(); if(selStart!=null && el.setSelectionRange) try{el.setSelectionRange(selStart, selStart);}catch(e){} }
  }
  window.scrollTo(0, scrollY);
}

    ${rightItems.map(([k,ic])=>`<button class="nav-btn ${state.activeTab===k?'active':''}" onclick="setTab('${k}')" title="${t(k)}">${ic}</button>`).join('')}

}

      <div class="rng">${winStart===winEnd? winStart : winStart+' - '+winEnd} / ${dim}</div>

          }).join('')}

          ${tasks.map(task=>renderTaskRow(task, winStart, winEnd)).join('')}

    <span><i style="border:2px solid var(--none); background:transparent;"></i>${t('none')}</span>

function renderTaskRow(task, winStart, winEnd){
  let cells = '';
  for(let d=winStart; d<=winEnd; d++){
    if(!isApplicable(task,d)){
      cells += `<td><span class="status-dot na"></span></td>`;
      continue;
    }
    const s = task.statuses[d];
    const cls = s || 'pending';
    const icon = s==='done'?'✓':s==='late'?'!':s==='missed'?'✕':'';
    cells += `<td><span class="status-dot ${cls}" onclick="cycleStatus('${task.id}',${d})">${icon}</span></td>`;
  }
  return `<tr class="task-row">
    <td class="task-cell">
      <div class="task-ic" style="background:${task.color}22; color:${task.color};" onclick="toggleTaskName('${task.id}')">${task.icon}</div>
      ${state.visibleNames.has(task.id) ? `<span class="task-name-tag" onclick="openDetail('${task.id}')">${escapeHtml(task.name)}</span>` : ''}
    </td>
    ${cells}
  </tr>`;
}

function renderDailyTrendChart(dim){
  const totalTasks = state.tasks.length;
  if(totalTasks===0){ return `<div class="empty-hint">${t('noData')}</div>`; }

  const daily = [];
  for(let d=1; d<=dim; d++){
    daily.push(state.tasks.filter(x=>x.statuses[d]==='done').length);
  }
  const maxY = Math.max(totalTasks, 1);

  // pick tick values for the y axis
  let ticks;
  if(maxY<=12){
    ticks = Array.from({length:maxY+1},(_,i)=>i);
  } else {
    const steps = 6;
    ticks = Array.from({length:steps+1},(_,i)=>Math.round((maxY/steps)*i));
  }

  const axisReserve = 34, leftPad = 10, stepX = 20, topPad = 12, bottomPad = 28;
  const plotH = 210;
  const chartW = leftPad + dim*stepX + axisReserve;
  const chartH = topPad + plotH + bottomPad;
  const axisX = chartW - axisReserve;

  const xFor = i => axisX - i*stepX - stepX/2;
  const yFor = v => topPad + plotH - (v/maxY)*plotH;

  const points = daily.map((v,i)=>`${xFor(i)},${yFor(v)}`).join(' ');

  const gridLines = ticks.map(v=>`
    <line x1="${leftPad}" y1="${yFor(v)}" x2="${axisX}" y2="${yFor(v)}" stroke="var(--border)" stroke-width="1"/>
    <text x="${axisX+8}" y="${yFor(v)+4}" font-size="10" fill="var(--text-muted)" text-anchor="start">${v}</text>
  `).join('');

  const axisLine = `<line x1="${axisX}" y1="${topPad}" x2="${axisX}" y2="${topPad+plotH}" stroke="var(--border)" stroke-width="1.5"/>`;

  const dayLabels = daily.map((v,i)=>{
    const d = i+1;
    const isCurrent = state.month===today.getMonth() && state.year===today.getFullYear() && d===today.getDate();
    return `<text x="${xFor(i)}" y="${chartH-8}" font-size="9.5" fill="${isCurrent?'var(--primary-dark)':'var(--text-muted)'}" font-weight="${isCurrent?'800':'400'}" text-anchor="middle">${d}</text>`;
  }).join('');

  const dots = daily.map((v,i)=>`<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3.5" fill="var(--primary)" stroke="var(--surface)" stroke-width="1.5"><title>${t('weekdays')[new Date(state.year,state.month,i+1).getDay()]} ${i+1}: ${v}</title></circle>`).join('');

  return `
  <div style="overflow-x:auto;">
    <svg width="${chartW}" height="${chartH}" viewBox="0 0 ${chartW} ${chartH}" style="display:block;">
      ${gridLines}
      ${axisLine}
      <polyline points="${points}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${dayLabels}
    </svg>
  </div>
  <div style="text-align:center; font-size:11px; color:var(--text-muted); margin-top:6px;">${t('tasksAxis')}</div>
  `;
}

function renderStats(){
  const stats = computeMonthStats();
  const streak = computeStreak();
  const xp = computeXP();
  const {best, worst} = bestWorstHabit();
  const dim = daysInMonth(state.year, state.month);

  // weekly buckets
  const weeks = [];
  for(let d=1; d<=dim; d+=7){
    const end = Math.min(d+6, dim);
    let applicable=0, done=0;
    state.tasks.forEach(task=>{
      for(let x=d; x<=end; x++){
        if(!isApplicable(task,x)) continue;
        applicable++;
        if(task.statuses[x]==='done') done++;
      }
    });
    weeks.push({label:`${d}-${end}`, pct: applicable? Math.round(done/applicable*100):0});

  return `
  <div class="section-title" style="margin-top:0;">${t('stats')}</div>

  <div class="stat-row" style="margin-bottom:18px;">
    <div class="card stat-card"><div class="ic">✅</div><div class="val">${stats.done}</div><div class="lbl">${t('completed')}</div></div>

    <div class="card stat-card"><div class="ic">⭐</div><div class="val">${xp}</div><div class="lbl">${t('xp')}</div></div>
  </div>

  <div class="stat-grid" style="margin-bottom:18px;">
    <div class="card stat-box"><div class="v">${stats.pct}%</div><div class="l">${t('avgCompletion')}</div></div>
    <div class="card stat-box"><div class="v">${streak}</div><div class="l">${t('bestStreak')}</div></div>
    <div class="card stat-box"><div class="v">${best? escapeHtml(best.t.name)+' ('+best.pct+'%)' : '—'}</div><div class="l">${t('bestHabit')}</div></div>
    <div class="card stat-box"><div class="v">${worst? escapeHtml(worst.t.name)+' ('+worst.pct+'%)' : '—'}</div><div class="l">${t('worstHabit')}</div></div>
  </div>

  <div class="section-title">${t('weeklyChart')}</div>
  <div class="card" style="padding:10px 16px;">
    ${weeks.every(w=>w.pct===0) ? `<div class="empty-hint">${t('noData')}</div>` : `
    <div class="bars">
      ${weeks.map(w=>`<div class="bar-col"><div class="bar" style="height:${Math.max(w.pct,3)}%;"></div><div class="bar-lbl">${w.label}</div></div>`).join('')}
    </div>`}
  </div>

  <div class="section-title">${t('tasks')}</div>
  <div class="card" style="padding:10px 16px;">
    ${state.tasks.length===0 ? `<div class="empty-hint">${t('noTasks')}</div>` : `
    <div style="display:flex; flex-direction:column; gap:12px; padding:8px 0;">
    ${state.tasks.map(task=>{
      const pct = taskCommitment(task);
      return `<div>

function setAuthMode(m){ state.auth.mode=m; state.authError=''; render(); }
function submitAuth(){

  state.user = { name: isSignup ? d.name.trim() : d.email.split('@')[0], email: d.email.trim() };
  state.auth.loggedIn = true;
  state.authError = '';
  render();
}
function oauthLogin(provider){
  state.user = { name: provider+' User', email: '' };
  state.auth.loggedIn = true;
  state.authError = '';
  render();
}
function continueAsGuest(){
  state.user = { name: t('guestUser'), email: '' };
  state.auth.loggedIn = true;
  render();
}
function forgotPassword(){
  alert(t('resetLinkSent'));
}
function logout(){
  state.auth.loggedIn = false;
  state.auth.mode = 'login';
  state.user = null;
  state.authDraft = { name:'', email:'', password:'' };
  state.activeTab = 'home';
  render();
}

/* ---------------- modal: task ---------------- */
let draft = null;

function openTaskModal(taskId){
  const existing = taskId ? state.tasks.find(x=>x.id===taskId) : null;
  draft = existing ? JSON.parse(JSON.stringify(existing)) : {
    id:null, name:"", desc:"", icon:ICONS[0], color:COLORS[0], category: state.categories[0]? state.categories[0].id : "",
    priority:"medium", recurrence:{type:"daily", weekday:0, dayOfMonth:1, days:[], date:""}, notif:true, statuses:{}
  };
  state.modal = {type:'task', editing: !!existing};
  render();
}
function closeModal(){ state.modal=null; draft=null; render(); }

function renderModal(){
  if(state.modal.type==='task') return renderTaskModal();
  if(state.modal.type==='category') return renderCategoryModal();
  if(state.modal.type==='detail') return renderDetailModal();
  return '';
}

function renderTaskModal(){
  const r = draft.recurrence;
  return `<div class="overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <h3>${state.modal.editing? t('editTask') : t('newTask')}</h3>

    <div class="field"><label>${t('name')}</label>
      <input type="text" id="dName" value="${escapeHtml(draft.name)}" oninput="draft.name=this.value">
    </div>
    <div class="field"><label>${t('description')}</label>
      <textarea id="dDesc" oninput="draft.desc=this.value">${escapeHtml(draft.desc||'')}</textarea>
    </div>
    <div class="field"><label>${t('icon')}</label>
      <div class="emojis">${ICONS.concat(state.customIcons).map(ic=>`<div class="emo ${draft.icon===ic?'sel':''}" onclick="draft.icon='${ic}'; render();">${ic}</div>`).join('')}</div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <input type="text" id="customIconInput" maxlength="4" placeholder="${t('customIconPlaceholder')}" style="flex:1;">
        <button type="button" class="btn btn-ghost" onclick="addCustomIcon()">${t('addNew')}</button>
      </div>
    </div>
    <div class="field"><label>${t('color')}</label>
      <div class="swatches">
        ${COLORS.concat(state.customColors).map(c=>`<div class="swatch ${draft.color===c?'sel':''}" style="background:${c};" onclick="draft.color='${c}'; render();"></div>`).join('')}
        <input type="color" id="customColorInput" value="${draft.color}" title="${t('customColorLabel')}" style="width:28px;height:28px;border:none;border-radius:50%;padding:0;cursor:pointer;" oninput="draft.color=this.value; render();" onchange="addCustomColor(this.value)">
      </div>
    </div>
    <div class="field"><label>${t('category')}</label>
      <div style="display:flex; gap:8px;">
        <select style="flex:1;" onchange="draft.category=this.value">
          <option value="" ${!draft.category?'selected':''}>${t('noCategory')}</option>
          ${state.categories.map(c=>`<option value="${c.id}" ${draft.category===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
        </select>
        <button type="button" class="icon-btn" onclick="openCategoryModal(true)" title="${t('addCategory')}">＋</button>
      </div>
    </div>
    <div class="field"><label>${t('priority')}</label>
      <select onchange="draft.priority=this.value">
        <option value="low" ${draft.priority==='low'?'selected':''}>${t('low')}</option>
        <option value="medium" ${draft.priority==='medium'?'selected':''}>${t('medium')}</option>
        <option value="high" ${draft.priority==='high'?'selected':''}>${t('high')}</option>
      </select>
    </div>
    <div class="field"><label>${t('recurrence')}</label>
      <select onchange="draft.recurrence.type=this.value; render();">
        <option value="daily" ${r.type==='daily'?'selected':''}>${t('daily')}</option>
        <option value="weekly" ${r.type==='weekly'?'selected':''}>${t('weekly')}</option>
        <option value="monthly" ${r.type==='monthly'?'selected':''}>${t('monthly')}</option>
        <option value="specific" ${r.type==='specific'?'selected':''}>${t('specificDays')}</option>
        <option value="once" ${r.type==='once'?'selected':''}>${t('once')}</option>
      </select>
    </div>
    ${r.type==='weekly' ? `<div class="field"><label>${t('weekday')}</label>
      <select onchange="draft.recurrence.weekday=parseInt(this.value)">
        ${t('weekdays').map((w,i)=>`<option value="${i}" ${r.weekday===i?'selected':''}>${w}</option>`).join('')}
      </select></div>` : ''}
    ${r.type==='monthly' ? `<div class="field"><label>${t('dayOfMonth')}</label>
      <input type="number" min="1" max="31" value="${r.dayOfMonth||1}" oninput="draft.recurrence.dayOfMonth=parseInt(this.value)||1"></div>` : ''}
    ${r.type==='specific' ? `<div class="field"><label>${t('chooseDays')}</label>
      <div class="weekday-picker">${t('weekdays').map((w,i)=>`<div class="wd ${(r.days||[]).includes(i)?'sel':''}" onclick="toggleWd(${i})">${w}</div>`).join('')}</div></div>` : ''}
    ${r.type==='once' ? `<div class="field"><label>${t('date')}</label>
      <input type="date" value="${r.date||''}" oninput="draft.recurrence.date=this.value"></div>` : ''}

    <div class="field toggle-row">
      <label style="margin:0;">${t('notifications')}</label>
      <div class="switch ${draft.notif?'on':''}" onclick="draft.notif=!draft.notif; render();"><div class="knob"></div></div>

    <div class="modal-actions">
      ${state.modal.editing? `<button class="btn btn-danger" onclick="deleteTask('${draft.id}')">${t('delete')}</button>`:''}

      <button class="btn btn-primary" onclick="saveTask()">${t('save')}</button>
    </div>
  </div></div>`;
}
function toggleWd(i){
  const days = draft.recurrence.days || [];
  const idx = days.indexOf(i);
  if(idx>-1) days.splice(idx,1); else days.push(i);
  draft.recurrence.days = days;
  render();
}
function addCustomIcon(){
  const inp = document.getElementById('customIconInput');
  const val = inp.value.trim();
  if(!val) return;
  if(!ICONS.includes(val) && !state.customIcons.includes(val)) state.customIcons.push(val);
  draft.icon = val;
  render();
}
function addCustomColor(hex){
  if(!COLORS.includes(hex) && !state.customColors.includes(hex)) state.customColors.push(hex);
}
function saveTask(){
  if(!draft.name.trim()) { alert(state.lang==='ar'?'يرجى إدخال اسم المهمة':'Please enter a task name'); return; }
  if(draft.id){
    const idx = state.tasks.findIndex(x=>x.id===draft.id);
    state.tasks[idx] = draft;
  } else {
    draft.id = uid();
    state.tasks.push(draft);
  }
  closeModal();
}
function deleteTask(id){
  state.tasks = state.tasks.filter(x=>x.id!==id);
  closeModal();
}

/* ---------------- modal: category ---------------- */
function openCategoryModal(returnToTask){ state.modal={type:'category', returnToTask: !!returnToTask}; render(); }
function closeCategoryModal(){
  if(state.modal && state.modal.returnToTask && draft){
    state.modal = {type:'task', editing: !!draft.id};
  } else {
    state.modal = null; draft = null;
  }
  render();
}
function renderCategoryModal(){
  return `<div class="overlay" onclick="if(event.target===this) closeCategoryModal()">
  <div class="modal">
    <h3>${t('categoriesManage')}</h3>
    <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;">
      ${state.categories.map(c=>`<div style="display:flex; align-items:center; gap:10px;">
        <span style="width:16px;height:16px;border-radius:50%; background:${c.color}; display:inline-block;"></span>
        <span style="flex:1;">${escapeHtml(c.name)}</span>
        <button class="icon-btn" onclick="deleteCategory('${c.id}')">🗑️</button>
      </div>`).join('') || `<div class="empty-hint">${t('noData')}</div>`}
    </div>
    <div class="field"><label>${t('addCategory')}</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="newCatName" placeholder="${t('categoryName')}" style="flex:1;">
        <button class="btn btn-primary" onclick="addCategory()">＋</button>
      </div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeCategoryModal()" style="flex:1;">${t('close')}</button></div>
  </div></div>`;
}
function addCategory(){
  const inp = document.getElementById('newCatName');
  const name = inp.value.trim();
  if(!name) return;
  const color = COLORS[state.categories.length % COLORS.length];
  const newCat = {id:uid(), name, color};
  state.categories.push(newCat);
  if(draft) draft.category = newCat.id;
  if(state.modal && state.modal.returnToTask){
    state.modal = {type:'task', editing: !!(draft && draft.id)};
  } else {
    state.modal = {type:'category'};
  }
  render();
}
function deleteCategory(id){
  state.categories = state.categories.filter(c=>c.id!==id);
  state.tasks.forEach(t=>{ if(t.category===id) t.category=""; });
  const returnToTask = state.modal && state.modal.returnToTask;
  state.modal = {type:'category', returnToTask};
  render();
}

/* ---------------- modal: detail ---------------- */
function openDetail(taskId){ state.detailTaskId = taskId; state.modal={type:'detail'}; render(); }
function renderDetailModal(){
  const task = state.tasks.find(x=>x.id===state.detailTaskId);
  if(!task) return '';
  const dim = daysInMonth(state.year, state.month);
  let done=0, missed=0, applicable=0;
  let history = [];
  for(let d=1; d<=dim; d++){
    if(!isApplicable(task,d)) continue;
    applicable++;
    const s = task.statuses[d];
    if(s==='done') done++;
    if(s==='missed') missed++;
    if(s) history.push({d, s});
  }
  const pct = applicable? Math.round(done/applicable*100):0;
  return `<div class="overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <h3>${task.icon} ${escapeHtml(task.name)}</h3>
    <div class="stat-grid" style="margin-bottom:16px;">
      <div class="stat-box card"><div class="v">${pct}%</div><div class="l">${t('commitment')}</div></div>
      <div class="stat-box card"><div class="v">${done}</div><div class="l">${t('doneCount')}</div></div>
      <div class="stat-box card"><div class="v">${missed}</div><div class="l">${t('missedCount')}</div></div>
    </div>
    <div class="level-bar" style="margin-bottom:16px;"><div class="fill" style="width:${pct}%; background:${task.color};"></div></div>
    <div class="field"><label>${t('history')}</label>
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        ${history.length? history.map(h=>`<span class="status-dot ${h.s}" style="cursor:default;">${h.s==='done'?'✓':h.s==='late'?'!':'✕'}</span>`).join('') : `<span style="color:var(--text-muted); font-size:13px;">${t('noData')}</span>`}
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()" style="flex:1;">${t('close')}</button>
      <button class="btn btn-primary" onclick="closeModal(); openTaskModal('${task.id}');" style="flex:1;">${t('editTask')}</button>
    </div>
  </div></div>`;
}

/* ---------------- actions ---------------- */
function setTab(k){ state.activeTab=k; state.search=""; render(); }
function setLang(l){ state.lang=l; render(); }
function setTheme(th){ state.theme=th; render(); }
function onSearch(v){ state.search=v; render(); }
function changeMonth(delta){
  let m = state.month+delta, y = state.year;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  state.month=m; state.year=y;
  resetDayWindow();
  render();
}
function toggleSetting(key){ state[key] = !state[key]; render(); }

function exportData(){
  const payload = { categories: state.categories, tasks: state.tasks, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'waqti-data.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(data.categories) state.categories = data.categories;
      if(data.tasks) state.tasks = data.tasks;
      render();
    }catch(err){ alert(state.lang==='ar'?'ملف غير صالح':'Invalid file'); }
  };
  reader.readAsText(file);
}

/* ---------------- init ---------------- */
resetDayWindow();
state.tasks = seedTasks();
render();
const favLink = document.createElement('link');
favLink.rel = 'icon';
favLink.href = LOGO_DATA_URI;
document.head.appendChild(favLink);
</script>
</body>
